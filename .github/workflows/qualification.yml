name: Qualification

# Proofs called only by ci.yml for candidate qualification.
on:
  workflow_call:
    outputs:
      checks:
        description: Expected qualification check inventory
        value: ${{ jobs.postgres-lanes.outputs.checks }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

# Timeouts follow infra ci.md: twice the slowest green duration, rounded up.
# Jobs measured under 2.5 minutes get 5; unmeasured jobs get 90, stating why.
jobs:
  postgres-lanes:
    name: PostgreSQL lanes
    runs-on: ubuntu-24.04
    # Runtime setup added to the lane generator; no green run yet.
    timeout-minutes: 90 # no green run yet
    outputs:
      engine_major: ${{ steps.lanes.outputs.engine_major }}
      compatibility: ${{ steps.lanes.outputs.compatibility }}
      decoder: ${{ steps.lanes.outputs.decoder }}
      checks: ${{ steps.lanes.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        id: toolchain
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}
      - id: lanes
        run: scripts/ci/postgres-lanes.sh
      - run: python3 -B -m unittest discover -s scripts -p 'test_postgres_lanes.py'

  no-database:
    needs: postgres-lanes
    name: No-database tests
    runs-on: ubuntu-24.04
    # Green run 44208487858: No-database tests 38m14s.
    timeout-minutes: 77
    permissions:
      contents: read
    env:
      EXPECTED_PG_MAJOR: ${{ needs.postgres-lanes.outputs.engine_major }}
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        id: toolchain
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
        id: compile
      - run: mix format --check-formatted
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: elixir --version
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/test-prepush.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/test-release-checkers.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/test-release-contract.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: python3 -B -m unittest discover -s scripts -p 'test_qualify.py'
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: mix credo --strict
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - name: Dependency hygiene
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: mix deps.audit
      - name: Fixture dependency hygiene
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: scripts/audit-fixtures.sh
      - name: Test without a Repo
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: env -u ASH_REPLICANT_TEST_URL scripts/run-structural-tests.sh --allow-excluded --exclude integration

      - name: Guard-mutation gates
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        # Compare the candidate with main, including a new kci/ ref.
        # An unavailable base or an evidence-machinery change runs the full matrix.
        run: |
          if git fetch --no-tags --quiet origin main; then
            scripts/run-mutation-gates.py --diff-base FETCH_HEAD
          else
            scripts/run-mutation-gates.py
          fi

  compatibility:
    needs: postgres-lanes
    name: Dependencies ${{ matrix.label }} / PostgreSQL ${{ matrix.pg_major }}
    runs-on: ubuntu-24.04
    # Green run 44224060553: slowest compatibility cell 18m29s.
    timeout-minutes: 37
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.postgres-lanes.outputs.compatibility) }}
    env:
      EXPECTED_PG_MAJOR: ${{ matrix.pg_major }}
      MIX_ENV: test
      ASH_REPLICANT_ASH_VERSION: ${{ matrix.ash_selector }}
      ASH_REPLICANT_REPLICANT_VERSION: ${{ matrix.replicant_selector }}
      ASH_REPLICANT_ONETIME_VERSION: ${{ matrix.onetime_selector }}
      # Throwaway fixture password, never an external service credential.
      ASH_REPLICANT_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/ash_replicant_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start PostgreSQL from the declared lane
        uses: ./.github/actions/postgres
        with:
          image: ${{ matrix.pg_image }}

      - uses: ./.github/actions/toolchain
        id: toolchain
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}

      - name: Fetch and assert dependency versions
        env:
          LOCKFILE: ${{ matrix.lockfile }}
          ASH_REQUIREMENT: ${{ matrix.ash_requirement }}
          REPLICANT_REQUIREMENT: ${{ matrix.replicant_requirement }}
          ONETIME_REQUIREMENT: ${{ matrix.onetime_requirement }}
        run: |
          if [[ "$LOCKFILE" != 'mix.lock' ]]; then
            cp "$LOCKFILE" mix.lock
          fi
          mix deps.get --check-locked
          mix deps ash
          mix deps replicant
          mix deps ash_onetime
          scripts/assert-dependency-version.sh ash "$ASH_REQUIREMENT"
          scripts/assert-dependency-version.sh replicant "$REPLICANT_REQUIREMENT"
          scripts/assert-dependency-version.sh ash_onetime "$ONETIME_REQUIREMENT"

      - run: mix deps.compile

      - name: Create and migrate the integration database
        run: |
          mix ecto.create
          mix ecto.migrate

      - run: mix compile --warnings-as-errors
        id: compile

      - run: elixir --version
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/test-release-checkers.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/assert-release-contract.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}

      - name: Dependency hygiene
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: mix deps.audit

      - name: Check migration and resource snapshot drift
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: scripts/test-migration-drift-gate.sh

      - name: Full live suite
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: scripts/run-structural-tests.sh --include integration

      - name: Explicit integration discovery
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: scripts/run-structural-tests.sh test/integration --include integration

      - run: mix dialyzer
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - name: Remove PostgreSQL
        if: always()
        uses: ./.github/actions/postgres
        with:
          mode: stop

  performance:
    needs: postgres-lanes
    name: Measured performance bounds
    runs-on: ubuntu-24.04
    # Green run 44208487858: Measured performance bounds 3m14s.
    timeout-minutes: 7
    env:
      EXPECTED_PG_MAJOR: ${{ needs.postgres-lanes.outputs.engine_major }}
      MIX_ENV: test
      # Throwaway fixture password, never an external service credential.
      ASH_REPLICANT_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/ash_replicant_test
      ASH_REPLICANT_PERFORMANCE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the platform engine
        uses: ./.github/actions/postgres

      - uses: ./.github/actions/toolchain
        id: toolchain
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - name: Create and migrate the integration database
        run: |
          mix ecto.create
          mix ecto.migrate
      # ADR-0021's sentinel bounds, isolated in their own job: the legs are
      # heavy (thousands of rows through the guarded delivery path) and
      # their load destabilized the timing-sensitive lifecycle suites when
      # they ran inside every compatibility cell.
      - name: Performance bound sentinels
        run: scripts/run-structural-tests.sh test/integration/performance_bounds_test.exs --include integration
      - name: Remove PostgreSQL
        if: always()
        uses: ./.github/actions/postgres
        with:
          mode: stop

  decoder-sources:
    needs: postgres-lanes
    name: Plugin decoders / PostgreSQL ${{ matrix.pg_major }}
    runs-on: ubuntu-24.04
    # Green run 45895179176: slowest plugin decoder cell 3m26s.
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.postgres-lanes.outputs.decoder) }}
    env:
      EXPECTED_PG_SOURCE_MAJOR: ${{ matrix.pg_major }}
      EXPECTED_PG_MAJOR: ${{ needs.postgres-lanes.outputs.engine_major }}
      MIX_ENV: test
      # Job-level so ecto.create/migrate see the destination too.
      # Throwaway fixture password, never an external service credential.
      ASH_REPLICANT_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/ash_replicant_test
      ASH_REPLICANT_DECODER_SOURCE_URL: postgres://postgres:postgres@127.0.0.1:5433/ash_replicant_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        id: toolchain
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}

      - name: Build the decoder source image
        id: plugins
        env:
          PG_BASE: ${{ matrix.base }}
          WITH_WAL2JSON: ${{ matrix.legacy }}
        run: |
          docker build -f test/support/pg_old.dockerfile --build-arg "BASE=$PG_BASE" \
            --build-arg "WITH_WAL2JSON=$WITH_WAL2JSON" -t decoder-source-plugins:ci .
          image="$(docker image inspect --format '{{.Id}}' decoder-source-plugins:ci)"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Start the destination engine
        uses: ./.github/actions/postgres
      - name: Start the declared decoder source
        uses: ./.github/actions/postgres
        with:
          name: decoder-source
          port: '5433'
          image: ${{ steps.plugins.outputs.image }}
          decoder-source: ${{ matrix.legacy == 'true' && 'legacy' || 'modern' }}

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - name: Create and migrate the integration database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Exercise decoder admission and live delivery
        run: scripts/run-structural-tests.sh test/integration/decoder_admission_test.exs
      - name: Remove PostgreSQL
        if: always()
        uses: ./.github/actions/postgres
        with:
          mode: stop
      - name: Remove the decoder source
        if: always()
        uses: ./.github/actions/postgres
        with:
          mode: stop
          name: decoder-source
          port: '5433'

  fresh-consumer:
    needs: [postgres-lanes, release-artifact]
    name: Fresh tarball consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
    env:
      EXPECTED_PG_MAJOR: ${{ needs.postgres-lanes.outputs.engine_major }}
      MIX_ENV: dev
      # Throwaway fixture password, never an external service credential.
      ASH_REPLICANT_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/ash_replicant_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        id: toolchain
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}
      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - name: Start the candidate consumer's real PostgreSQL
        uses: ./.github/actions/postgres
      - name: Download the qualified Hex archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hex-hexpm-ash_replicant
          path: ${{ runner.temp }}/qualified-hex
      - name: Audit and exercise the qualified package as a fresh consumer
        run: scripts/test-fresh-consumer.sh "$RUNNER_TEMP/qualified-hex/package.tar"
      - name: Remove downloaded Hex archives
        if: always()
        run: rm -rf "$RUNNER_TEMP/qualified-hex"
      - name: Remove the candidate consumer's PostgreSQL
        if: always()
        uses: ./.github/actions/postgres
        with:
          mode: stop

  release-artifact:
    name: Selector-free docs and package
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        id: toolchain
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}

      - uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        with:
          operation: qualify
          package: ash_replicant
          package-directory: .
