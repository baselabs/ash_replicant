name: Qualification

# Proofs called only by ci.yml for candidate qualification.
on:
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read

# Timeouts follow infra ci.md: twice the slowest green duration, rounded up.
# Jobs measured under 2.5 minutes get 5; unmeasured jobs get 90, stating why.
jobs:
  no-database:
    name: No-database tests
    runs-on: ubuntu-24.04
    # Green run 44208487858: No-database tests 38m14s.
    timeout-minutes: 77
    permissions:
      contents: read
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: scripts/assert-runtime-version.sh

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
        id: compile
      - run: mix format --check-formatted
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: elixir --version
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/test-prepush.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/test-release-checkers.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/test-release-guards.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - run: scripts/test-release-contract.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: python3 -B -m unittest discover -s scripts -p 'test_qualify.py'
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: mix credo --strict
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - name: Dependency hygiene
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: mix deps.audit
      - name: Fixture dependency hygiene
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: scripts/audit-fixtures.sh
      - name: Test without a Repo
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: env -u ASH_REPLICANT_TEST_URL scripts/run-structural-tests.sh --allow-excluded --exclude integration

      - name: Guard-mutation gates
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        # Compare the candidate with main, including a new kci/ ref.
        # An unavailable base or an evidence-machinery change runs the full matrix.
        run: |
          if git fetch --no-tags --quiet origin main; then
            scripts/run-mutation-gates.py --diff-base FETCH_HEAD
          else
            scripts/run-mutation-gates.py
          fi

  compatibility:
    name: Dependencies ${{ matrix.label }} / PostgreSQL ${{ matrix.pg_major }}
    runs-on: ubuntu-24.04
    # Green run 44224060553: current-lock PG18, slowest compatibility cell 18m29s.
    timeout-minutes: 37
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: exact-floors
            lockfile: locks/exact-floors.lock
            ash_selector: "3.37.3"
            ash_requirement: "== 3.37.3"
            replicant_selector: "1.4.0"
            replicant_requirement: "== 1.4.0"
            onetime_selector: "1.3.2"
            onetime_requirement: "== 1.3.2"
            pg_major: "16"
            pg_image: "postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b"
          - label: current-lock
            lockfile: mix.lock
            ash_selector: ""
            ash_requirement: ">= 3.37.3 and < 4.0.0-0"
            replicant_selector: ""
            replicant_requirement: ">= 1.4.0 and < 2.0.0-0"
            onetime_selector: ""
            onetime_requirement: ">= 1.3.2 and < 2.0.0-0"
            pg_major: "16"
            pg_image: "postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b"
          - label: latest-compatible
            lockfile: locks/latest-compatible.lock
            ash_selector: latest
            ash_requirement: ">= 3.37.3 and < 4.0.0-0"
            replicant_selector: latest
            replicant_requirement: ">= 1.4.0 and < 2.0.0-0"
            onetime_selector: latest
            onetime_requirement: ">= 1.3.2 and < 2.0.0-0"
            pg_major: "16"
            pg_image: "postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b"
          - label: current-lock-pg17
            lockfile: mix.lock
            ash_selector: ""
            ash_requirement: ">= 3.37.3 and < 4.0.0-0"
            replicant_selector: ""
            replicant_requirement: ">= 1.4.0 and < 2.0.0-0"
            onetime_selector: ""
            onetime_requirement: ">= 1.3.2 and < 2.0.0-0"
            pg_major: "17"
            pg_image: "postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449"
          - label: current-lock-pg18
            lockfile: mix.lock
            ash_selector: ""
            ash_requirement: ">= 3.37.3 and < 4.0.0-0"
            replicant_selector: ""
            replicant_requirement: ">= 1.4.0 and < 2.0.0-0"
            onetime_selector: ""
            onetime_requirement: ">= 1.3.2 and < 2.0.0-0"
            pg_major: "18"
            pg_image: "postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941"
    env:
      MIX_ENV: test
      ASH_REPLICANT_ASH_VERSION: ${{ matrix.ash_selector }}
      ASH_REPLICANT_REPLICANT_VERSION: ${{ matrix.replicant_selector }}
      ASH_REPLICANT_ONETIME_VERSION: ${{ matrix.onetime_selector }}
      ASH_REPLICANT_TEST_URL: postgres://postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start PostgreSQL ${{ matrix.pg_major }} with logical replication
        env:
          PG_IMAGE: ${{ matrix.pg_image }}
        run: |
          docker run -d --name pg \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            "$PG_IMAGE" \
            -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=20
          scripts/wait-for-postgres.sh pg

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: scripts/assert-runtime-version.sh

      - name: Fetch and assert dependency versions
        env:
          LOCKFILE: ${{ matrix.lockfile }}
          ASH_REQUIREMENT: ${{ matrix.ash_requirement }}
          REPLICANT_REQUIREMENT: ${{ matrix.replicant_requirement }}
          ONETIME_REQUIREMENT: ${{ matrix.onetime_requirement }}
        run: |
          if [[ "$LOCKFILE" != 'mix.lock' ]]; then
            cp "$LOCKFILE" mix.lock
          fi
          mix deps.get --check-locked
          mix deps ash
          mix deps replicant
          mix deps ash_onetime
          scripts/assert-dependency-version.sh ash "$ASH_REQUIREMENT"
          scripts/assert-dependency-version.sh replicant "$REPLICANT_REQUIREMENT"
          scripts/assert-dependency-version.sh ash_onetime "$ONETIME_REQUIREMENT"

      - run: mix deps.compile

      - name: Create and migrate the integration database
        run: |
          mix ecto.create
          mix ecto.migrate

      - run: mix compile --warnings-as-errors
        id: compile

      - run: elixir --version
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/test-release-checkers.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      - run: scripts/assert-release-contract.sh
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}

      - name: Dependency hygiene
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: mix deps.audit

      - name: Check migration and resource snapshot drift
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: scripts/test-migration-drift-gate.sh

      - name: Full live suite
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: scripts/run-structural-tests.sh --include integration

      - name: Explicit integration discovery
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: scripts/run-structural-tests.sh test/integration --include integration

      - run: mix dialyzer
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}

  performance:
    name: Measured performance bounds
    runs-on: ubuntu-24.04
    # Green run 44208487858: Measured performance bounds 3m14s.
    timeout-minutes: 7
    env:
      MIX_ENV: test
      ASH_REPLICANT_TEST_URL: postgres://postgres@localhost:5432/postgres
      ASH_REPLICANT_PERFORMANCE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start PostgreSQL 16 with logical replication
        run: |
          docker run -d --name pg \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b \
            -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=20
          scripts/wait-for-postgres.sh pg

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: scripts/assert-runtime-version.sh

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - name: Create and migrate the integration database
        run: |
          mix ecto.create
          mix ecto.migrate
      # ADR-0021's sentinel bounds, isolated in their own job: the legs are
      # heavy (thousands of rows through the guarded delivery path) and
      # their load destabilized the timing-sensitive lifecycle suites when
      # they ran inside every compatibility cell.
      - name: Performance bound sentinels
        run: scripts/run-structural-tests.sh test/integration/performance_bounds_test.exs --include integration

  decoder-old-majors:
    name: Plugin decoders / PostgreSQL ${{ matrix.pg_major }}
    runs-on: ubuntu-24.04
    # Green run 44224060553: PG12, slowest plugin decoder cell 3m15s.
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          # ADR-0026 / upstream ADR-0009's old-major substrate: the SAME
          # commit-pinned plugins (pglogical 2.4.8, wal2json master + the
          # 2.4 rejection lever), one cell per major. The destination stays
          # the pinned PostgreSQL 16 cell image.
          - pg_major: "12"
            base: postgres:12@sha256:2f2a8c2a7d10862e7fba2602e304523554f9df8244c632dafe2628ccb398fb5c
          - pg_major: "9.6"
            base: postgres:9.6@sha256:caddd35b05cdd56c614ab1f674e63be778e0abdf54e71a7507ff3e28d4902698
    env:
      MIX_ENV: test
      # Job-level so ecto.create/migrate see the destination too.
      ASH_REPLICANT_TEST_URL: postgres://postgres@localhost:5432/postgres
      ASH_REPLICANT_PGOLD_URL: postgres://postgres@localhost:5433/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: scripts/assert-runtime-version.sh

      - name: Build the old-major plugin substrate image
        env:
          PG_BASE: ${{ matrix.base }}
        run: docker build -f test/support/pg_old.dockerfile --build-arg "BASE=$PG_BASE" -t pgold-plugins:ci .

      - name: Start the destination and the old-major source
        run: |
          # The old images' entrypoint never appends a `host replication`
          # pg_hba line (unlike 12+), so the walsender needs this file.
          printf 'local all all trust\nhost all all all trust\nhost replication all all trust\n' > /tmp/pgold-hba.conf
          docker run -d --name pg \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b \
            -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=20
          docker run -d --name pgold \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5433:5432 \
            -v /tmp/pgold-hba.conf:/hba.conf:ro \
            pgold-plugins:ci \
            -c wal_level=logical -c max_wal_senders=20 -c max_replication_slots=20 \
            -c shared_preload_libraries=pglogical -c hba_file=/hba.conf
          scripts/wait-for-postgres.sh pg
          scripts/wait-for-postgres.sh pgold

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - name: Create and migrate the integration database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Decoder admission lane (pglogical, wal2json, pgoutput-on-old)
        run: scripts/run-structural-tests.sh test/integration/decoder_admission_test.exs --include pgold

  fresh-consumer:
    name: Fresh tarball consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
    env:
      MIX_ENV: dev
      ASH_REPLICANT_TEST_URL: postgres://postgres@localhost:5432/ash_replicant_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: scripts/assert-runtime-version.sh
      - run: mix local.hex 2.7.0 --force
      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - name: Start the candidate consumer's real PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p 5432:5432 \
            postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b \
            -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=20
          scripts/wait-for-postgres.sh pg
      - name: Audit and exercise the candidate package as a fresh consumer
        run: scripts/test-fresh-consumer.sh
      - name: Remove the candidate consumer's PostgreSQL
        if: always()
        run: docker rm -fv pg

  release-artifact:
    name: Selector-free docs and package
    runs-on: ubuntu-24.04
    # Green run 44572306314: Selector-free docs and package 5m33s, no cache restored.
    timeout-minutes: 12
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: scripts/assert-runtime-version.sh
      - run: mix local.hex 2.7.0 --force

      - run: env -u ASH_REPLICANT_ASH_VERSION -u ASH_REPLICANT_REPLICANT_VERSION -u ASH_REPLICANT_ONETIME_VERSION mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - run: elixir --version
      - run: scripts/assert-release-contract.sh
      - name: Assert selector-free public dependency requirements
        run: |
          env -u ASH_REPLICANT_ASH_VERSION -u ASH_REPLICANT_REPLICANT_VERSION -u ASH_REPLICANT_ONETIME_VERSION mix run --no-start -e '
          deps = Mix.Project.config() |> Keyword.fetch!(:deps)

          expected = %{
            ash: ">= 3.37.3 and < 4.0.0-0",
            replicant: ">= 1.4.0 and < 2.0.0-0",
            ash_onetime: ">= 1.3.2 and < 2.0.0-0",
            ash_cloak: ">= 0.4.0 and < 1.0.0-0"
          }

          Enum.each(expected, fn {dependency, requirement} ->
            actual = deps |> List.keyfind!(dependency, 0) |> elem(1)
            unless actual == requirement, do: raise("unexpected public dependency requirement")
          end)
          '

      - run: scripts/build-release-docs.sh "$RUNNER_TEMP/hex-docs.tar.gz"

      - name: Inspect the upload archives and exercise their guards without a key
        run: |
          trap 'rm -rf "$RUNNER_TEMP/package.tar" "$RUNNER_TEMP/hex-docs.tar.gz" "$RUNNER_TEMP/hex-docs.tar.gz.rendered"' EXIT
          version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          python3 -I scripts/check-docs-archive.py "$RUNNER_TEMP/hex-docs.tar.gz" "$RUNNER_TEMP/hex-docs.tar.gz.rendered" --version "$version" --commit "$GITHUB_SHA"
          env -u ASH_REPLICANT_ASH_VERSION -u ASH_REPLICANT_REPLICANT_VERSION -u ASH_REPLICANT_ONETIME_VERSION scripts/with-release-runtime.sh mix hex.build --output "$RUNNER_TEMP/package.tar"
          scripts/inspect-release-package.sh "$RUNNER_TEMP/package.tar"
          python3 -B scripts/test_release_docs.py "$RUNNER_TEMP/hex-docs.tar.gz" "$RUNNER_TEMP/hex-docs.tar.gz.rendered"
          cd "$RUNNER_TEMP"
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/test_publish_hex_artifacts.exs"

      - name: Build and inspect unpacked Hex package
        run: |
          package_dir=$(mktemp -d)
          trap 'rm -rf "$package_dir"' EXIT
          env -u ASH_REPLICANT_ASH_VERSION -u ASH_REPLICANT_REPLICANT_VERSION -u ASH_REPLICANT_ONETIME_VERSION mix hex.build --unpack --output "$package_dir"

          for required in lib .formatter.exs mix.exs README.md LICENSE NOTICE CHANGELOG.md usage-rules.md \
            lib/ash_replicant/upgrade.ex lib/ash_replicant/upgrade/checkpoint.ex \
            lib/mix/tasks/ash_replicant.upgrade.ex; do
            test -e "$package_dir/$required" || {
              echo "::error::Missing package path: $required"
              exit 1
            }
          done

          residue="$(find "$package_dir" -type d \( -name test -o -name .forge -o -name _build \) -print -quit)"
          if [[ -n "$residue" ]]; then
            echo "::error::Package contains test, Forge, or build residue"
            exit 1
          fi

          if test -e "$package_dir/priv"; then
            echo "::error::Package contains private migrations"
            exit 1
          fi

          credentials="$(find "$package_dir" -type f \( -name '.env*' -o -name '*.pem' -o -name '*.key' \) -print -quit)"
          if [[ -n "$credentials" ]]; then
            echo "::error::Package contains a credential-shaped file"
            exit 1
          fi

          package_files="$(cd "$package_dir" && find . \( -type f -o -type l \) | sed 's|^./||' | LC_ALL=C sort)"
          if ! diff -u scripts/release-package-files.txt - <<<"$package_files"; then
            echo "::error::Package files differ from the release allowlist"
            exit 1
          fi
