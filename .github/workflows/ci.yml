name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.3"
  OTP_VERSION: "29"

jobs:
  no-database:
    name: No-database tests
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-no-db-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - name: Assert release runtime
        run: |
          elixir --version
          scripts/assert-runtime-version.sh
          scripts/test-release-checkers.sh
          scripts/test-release-contract.sh
      - run: mix credo --strict
      - name: Dependency hygiene
        run: mix deps.audit
      - name: Test without a Repo
        run: env -u ASH_REPLICANT_TEST_URL scripts/run-structural-tests.sh --allow-excluded --exclude integration

  compatibility:
    name: Ash ${{ matrix.label }} / PostgreSQL 16
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: floor-3.31.3
            selector: "3.31.3"
            unlock: true
            requirement: "== 3.31.3"
          - label: current-lock
            selector: ""
            unlock: false
            requirement: ">= 3.31.3 and < 4.0.0-0"
          - label: latest-3.x
            selector: latest
            unlock: true
            requirement: ">= 3.31.3 and < 4.0.0-0"
    env:
      MIX_ENV: test
      ASH_REPLICANT_ASH_VERSION: ${{ matrix.selector }}
      ASH_REPLICANT_TEST_URL: postgres://postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start PostgreSQL 16 with logical replication
        run: |
          docker run -d --name pg \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b \
            -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=20
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 1
          done
          docker exec pg pg_isready -U postgres || { docker logs pg; exit 1; }

      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies, build, and Dialyzer PLT
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-ash-${{ matrix.label }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}

      - name: Resolve and assert Ash version
        run: |
          if [[ '${{ matrix.unlock }}' == 'true' ]]; then
            mix deps.unlock ash
          fi
          mix deps.get
          mix deps ash
          scripts/assert-dependency-version.sh ash '${{ matrix.requirement }}'

      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - name: Assert release runtime and checker integrity
        run: |
          elixir --version
          scripts/assert-runtime-version.sh
          scripts/test-release-checkers.sh
          scripts/assert-release-contract.sh

      - name: Dependency hygiene
        run: mix deps.audit

      - name: Create and migrate the integration database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Check migration and resource snapshot drift
        run: scripts/test-migration-drift-gate.sh

      - name: Full live suite
        run: scripts/run-structural-tests.sh --include integration

      - name: Explicit integration discovery
        run: scripts/run-structural-tests.sh test/integration --include integration

      - run: mix dialyzer

  release-artifact:
    name: Selector-free docs and package
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-release-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}

      - run: env -u ASH_REPLICANT_ASH_VERSION mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - name: Assert release runtime
        run: |
          elixir --version
          scripts/assert-runtime-version.sh
          scripts/assert-release-contract.sh
      - name: Assert selector-free public Ash requirement
        run: |
          env -u ASH_REPLICANT_ASH_VERSION mix run --no-start -e '
          requirement =
            Mix.Project.config()
            |> Keyword.fetch!(:deps)
            |> List.keyfind!(:ash, 0)
            |> elem(1)

          unless requirement == ">= 3.31.3 and < 4.0.0-0" do
            raise "unexpected public Ash requirement: #{inspect(requirement)}"
          end'

      - run: mix docs --warnings-as-errors

      - name: Build and inspect unpacked Hex package
        run: |
          package_dir=$(mktemp -d)
          trap 'rm -rf "$package_dir"' EXIT
          env -u ASH_REPLICANT_ASH_VERSION mix hex.build --unpack --output "$package_dir"

          for required in lib .formatter.exs mix.exs README.md LICENSE NOTICE CHANGELOG.md usage-rules.md; do
            test -e "$package_dir/$required" || {
              echo "::error::Missing package path: $required"
              exit 1
            }
          done

          if find "$package_dir" -type d \( -name test -o -name .forge -o -name _build \) -print -quit | grep -q .; then
            echo "::error::Package contains test, Forge, or build residue"
            exit 1
          fi

          if find "$package_dir" -type f \( -name '.env*' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo "::error::Package contains a credential-shaped file"
            exit 1
          fi
