name: CI

# One run per kci/<commit> candidate. The qualified check is the only landing verdict;
# main moves only on it. A push to main, a tag, or a release starts nothing here.
on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    uses: ./.github/workflows/qualification.yml

  qualified:
    name: qualified
    if: always()
    needs: [qualification]
    runs-on: ubuntu-24.04
    # Green run 44172851101: qualified 0m7s.
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/qualify.py
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
