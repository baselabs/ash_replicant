name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.3"
  OTP_VERSION: "29"

jobs:
  no-database:
    name: No-database tests
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-no-db-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: elixir --version
      - run: scripts/assert-runtime-version.sh
      - run: scripts/test-release-checkers.sh
      - run: scripts/test-release-contract.sh
      - run: mix credo --strict
      - name: Dependency hygiene
        run: mix deps.audit
      - name: Test without a Repo
        run: env -u ASH_REPLICANT_TEST_URL scripts/run-structural-tests.sh --allow-excluded --exclude integration

      - name: Guard-mutation gates
        # Path-scoped per-push evidence (ADR-0003 discipline kept, cost
        # scoped): run only the cells the push makes relevant. The push
        # payload's BEFORE sha (empty on non-push events) names the prior
        # head; when it is absent or unfetchable (first push, force push,
        # reordered history) — or the diff touches the evidence machinery
        # itself — the runner falls back to the FULL matrix.
        run: |
          BASE="${{ github.event.before }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --quiet origin "$BASE"; then
            scripts/run-mutation-gates.py --diff-base "$BASE"
          else
            scripts/run-mutation-gates.py
          fi

  compatibility:
    name: Dependencies ${{ matrix.label }} / PostgreSQL ${{ matrix.pg_major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: exact-floors
            ash_selector: "3.31.3"
            ash_unlock: true
            ash_requirement: "== 3.31.3"
            replicant_selector: "1.2.3"
            replicant_unlock: true
            replicant_requirement: "== 1.2.3"
            onetime_selector: "1.1.0"
            onetime_unlock: true
            onetime_requirement: "== 1.1.0"
            pg_major: "16"
            pg_image: "postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b"
          - label: current-lock
            ash_selector: ""
            ash_unlock: false
            ash_requirement: ">= 3.31.3 and < 4.0.0-0"
            replicant_selector: ""
            replicant_unlock: false
            replicant_requirement: ">= 1.2.3 and < 2.0.0-0"
            onetime_selector: ""
            onetime_unlock: false
            onetime_requirement: ">= 1.1.0 and < 2.0.0-0"
            pg_major: "16"
            pg_image: "postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b"
          - label: latest-compatible
            ash_selector: latest
            ash_unlock: true
            ash_requirement: ">= 3.31.3 and < 4.0.0-0"
            replicant_selector: latest
            replicant_unlock: true
            replicant_requirement: ">= 1.2.3 and < 2.0.0-0"
            onetime_selector: latest
            onetime_unlock: true
            onetime_requirement: ">= 1.1.0 and < 2.0.0-0"
            pg_major: "16"
            pg_image: "postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b"
          - label: current-lock-pg17
            ash_selector: ""
            ash_unlock: false
            ash_requirement: ">= 3.31.3 and < 4.0.0-0"
            replicant_selector: ""
            replicant_unlock: false
            replicant_requirement: ">= 1.2.3 and < 2.0.0-0"
            onetime_selector: ""
            onetime_unlock: false
            onetime_requirement: ">= 1.1.0 and < 2.0.0-0"
            pg_major: "17"
            pg_image: "postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449"
          - label: current-lock-pg18
            ash_selector: ""
            ash_unlock: false
            ash_requirement: ">= 3.31.3 and < 4.0.0-0"
            replicant_selector: ""
            replicant_unlock: false
            replicant_requirement: ">= 1.2.3 and < 2.0.0-0"
            onetime_selector: ""
            onetime_unlock: false
            onetime_requirement: ">= 1.1.0 and < 2.0.0-0"
            pg_major: "18"
            pg_image: "postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941"
    env:
      MIX_ENV: test
      ASH_REPLICANT_ASH_VERSION: ${{ matrix.ash_selector }}
      ASH_REPLICANT_REPLICANT_VERSION: ${{ matrix.replicant_selector }}
      ASH_REPLICANT_ONETIME_VERSION: ${{ matrix.onetime_selector }}
      ASH_REPLICANT_TEST_URL: postgres://postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start PostgreSQL ${{ matrix.pg_major }} with logical replication
        run: |
          docker run -d --name pg \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            ${{ matrix.pg_image }} \
            -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=20
          scripts/wait-for-postgres.sh pg

      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies, build, and Dialyzer PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-ash-${{ matrix.label }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}

      - name: Resolve and assert dependency versions
        run: |
          if [[ '${{ matrix.ash_unlock }}' == 'true' ]]; then
            mix deps.unlock ash
          fi
          if [[ '${{ matrix.replicant_unlock }}' == 'true' ]]; then
            mix deps.unlock replicant
          fi
          if [[ '${{ matrix.onetime_unlock }}' == 'true' ]]; then
            mix deps.unlock ash_onetime
          fi
          mix deps.get
          mix deps ash
          mix deps replicant
          mix deps ash_onetime
          scripts/assert-dependency-version.sh ash '${{ matrix.ash_requirement }}'
          scripts/assert-dependency-version.sh replicant '${{ matrix.replicant_requirement }}'
          scripts/assert-dependency-version.sh ash_onetime '${{ matrix.onetime_requirement }}'

      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - run: elixir --version
      - run: scripts/assert-runtime-version.sh
      - run: scripts/test-release-checkers.sh
      - run: scripts/assert-release-contract.sh

      - name: Dependency hygiene
        run: mix deps.audit

      - name: Create and migrate the integration database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Check migration and resource snapshot drift
        run: scripts/test-migration-drift-gate.sh

      - name: Full live suite
        run: scripts/run-structural-tests.sh --include integration

      - name: Explicit integration discovery
        run: scripts/run-structural-tests.sh test/integration --include integration

      - run: mix dialyzer

  performance:
    name: Measured performance bounds
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      ASH_REPLICANT_TEST_URL: postgres://postgres@localhost:5432/postgres
      ASH_REPLICANT_PERFORMANCE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start PostgreSQL 16 with logical replication
        run: |
          docker run -d --name pg \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b \
            -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=20
          scripts/wait-for-postgres.sh pg

      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-perf-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - name: Create and migrate the integration database
        run: |
          mix ecto.create
          mix ecto.migrate
      # ADR-0021's sentinel bounds, isolated in their own job: the legs are
      # heavy (thousands of rows through the guarded delivery path) and
      # their load destabilized the timing-sensitive lifecycle suites when
      # they ran inside every compatibility cell.
      - name: Performance bound sentinels
        run: scripts/run-structural-tests.sh test/integration/performance_bounds_test.exs --include integration

  release-artifact:
    name: Selector-free docs and package
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-release-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}

      - run: env -u ASH_REPLICANT_ASH_VERSION -u ASH_REPLICANT_REPLICANT_VERSION mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - run: elixir --version
      - run: scripts/assert-runtime-version.sh
      - run: scripts/assert-release-contract.sh
      - name: Assert selector-free public dependency requirements
        run: |
          env -u ASH_REPLICANT_ASH_VERSION -u ASH_REPLICANT_REPLICANT_VERSION mix run --no-start -e '
          deps = Mix.Project.config() |> Keyword.fetch!(:deps)

          expected = %{
            ash: ">= 3.31.3 and < 4.0.0-0",
            replicant: ">= 1.2.3 and < 2.0.0-0"
          }

          Enum.each(expected, fn {dependency, requirement} ->
            actual = deps |> List.keyfind!(dependency, 0) |> elem(1)
            unless actual == requirement, do: raise("unexpected public dependency requirement")
          end)
          '

      - run: mix docs --warnings-as-errors

      - name: Build and inspect unpacked Hex package
        run: |
          package_dir=$(mktemp -d)
          trap 'rm -rf "$package_dir"' EXIT
          env -u ASH_REPLICANT_ASH_VERSION -u ASH_REPLICANT_REPLICANT_VERSION mix hex.build --unpack --output "$package_dir"

          for required in lib .formatter.exs mix.exs README.md LICENSE NOTICE CHANGELOG.md usage-rules.md \
            lib/ash_replicant/upgrade.ex lib/ash_replicant/upgrade/checkpoint.ex \
            lib/mix/tasks/ash_replicant.upgrade.ex; do
            test -e "$package_dir/$required" || {
              echo "::error::Missing package path: $required"
              exit 1
            }
          done

          if find "$package_dir" -type d \( -name test -o -name .forge -o -name _build \) -print -quit | grep -q .; then
            echo "::error::Package contains test, Forge, or build residue"
            exit 1
          fi

          if test -e "$package_dir/priv"; then
            echo "::error::Package contains private migrations"
            exit 1
          fi

          if find "$package_dir" -type f \( -name '.env*' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo "::error::Package contains a credential-shaped file"
            exit 1
          fi
